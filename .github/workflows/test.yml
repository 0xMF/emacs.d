---
name: CI

on:
  pull_request:
  push:
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      matrix:
        emacs_version:
          - '31.1'
        experimental: [false]
        include:
          - emacs_version: snapshot
            experimental: true
    steps:
      - uses: actions/checkout@v7

      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}

      - name: Check startup
        run: ./test-startup.sh
